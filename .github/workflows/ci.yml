name: CI

# Verificación en cada push y en cada Pull Request: instala con el lockfile,
# corre los tests de la lógica de negocio y COMPILA el sitio.
#
# El build es la parte importante: antes nada comprobaba que el sitio siguiera
# compilando antes de que el deploy entrara por SSH al VPS a reconstruir. Un
# feed malformado o un import roto se descubría en producción.
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Test + Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Tests
        run: npm test

      - name: Build
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://kalidapresio.albis-labs.xyz' }}
        run: npm run build

      - name: Comprobar que la canónica NO apunta a localhost
        # Guardia de regresión del fallo que tuvo el sitio fuera del índice:
        # sin `site` en astro.config, cada página salía con
        # <link rel="canonical" href="http://localhost:4321/">.
        run: |
          if grep -rq 'canonical" href="http://localhost' dist/; then
            echo "❌ Hay canónicas apuntando a localhost. ¿Falta SITE_URL?"
            grep -rl 'canonical" href="http://localhost' dist/ | head
            exit 1
          fi
          echo "✅ Canónicas correctas."

      - name: Comprobar que no hay links de afiliado armados a mano
        # Guardia de regresión de la comisión que no llegó: el sitio pegaba
        # matt_tool/matt_word a la URL del producto y Mercado Libre no atribuía
        # la compra. Los únicos links válidos son los oficiales de la vitrina.
        # /panel/ queda fuera: muestra el archivo de la vitrina tal cual para que
        # veas qué arreglar, incluido un link mal pegado (que no se publica).
        run: |
          if grep -rlq --exclude-dir=panel 'matt_tool=' dist/; then
            echo "❌ Hay links con matt_tool armados a mano en el build:"
            grep -rl --exclude-dir=panel 'matt_tool=' dist/ | head
            exit 1
          fi
          echo "✅ Ningún link armado a mano."
