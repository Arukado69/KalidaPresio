name: Trigger Hetzner Deployment

on:
  push:
    branches:
      - main
    # Dispara en TODO push a main, incluidos los commits de datos del bot
    # (cada 3 h). Antes se ignoraban → el sitio se congelaba con precios viejos.
    # Ahora cada refresco de datos redespliega: precios frescos + el build
    # regenera relampago.json (endsAt +24h) → el carrusel nunca se vacía.
    # El deploy solo hace SSH+rebuild (no commitea), así que no hay loop.
  workflow_dispatch: {}   # permite disparar el deploy a mano cuando quieras

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Executes SSH commands on Hetzner
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          script: |
            set -e
            cd /var/www/kalidapresio
            git fetch --all
            git reset --hard origin/main
            # Reconstruye y levanta AMBOS servicios (frontend Caddy + backend).
            docker compose up -d --build
            # Limpia imágenes huérfanas para no llenar el disco del VPS.
            docker image prune -f