name: Desplegar en Hetzner

# Cada push a main —incluidos los commits de datos del bot cada 3 h— reconstruye
# el sitio en el VPS. Es lo que mantiene los precios frescos: sin esto, el
# sitio se congela con el feed del último despliegue manual.
#
# El deploy solo hace SSH + rebuild (no commitea), así que no hay bucle.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-produccion
  cancel-in-progress: false

jobs:
  # ── Puerta de calidad ───────────────────────────────────────────────────────
  # Si el sitio no compila, no se toca producción. Antes el deploy entraba por
  # SSH directamente y el error se descubría en el VPS, con el contenedor viejo
  # sirviendo mientras alguien investigaba.
  verificar:
    name: Test + Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - env:
          SITE_URL: ${{ vars.SITE_URL || 'https://kalidapresio.albis-labs.xyz' }}
          SKIP_EXTRACCION: 'true'
        run: npm run build

  desplegar:
    name: SSH + docker compose
    needs: verificar
    runs-on: ubuntu-latest
    steps:
      - name: Ejecutar el despliegue en el VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          # Autenticación: SSH_KEY si existe, si no, SSH_PASSWORD.
          # appleboy/ssh-action usa la llave cuando viene con contenido y cae a
          # la contraseña cuando llega vacia. Los dos declarados a la vez es lo
          # que evita que el despliegue muera en silencio: cambiar a `key:` sin
          # crear el secreto dejó 7 despliegues fallando y la producción 16 dias
          # congelada mientras main seguía avanzando.
          # Para migrar a llave (recomendado):
          #   ssh-keygen -t ed25519 -C "github-actions-kalidapresio" -f deploy_key
          # La pública va a ~/.ssh/authorized_keys del VPS; la privada, al
          # secret SSH_KEY del repo. En cuanto exista, manda ella sola.
          key: ${{ secrets.SSH_KEY }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/kalidapresio

            git fetch --all
            git reset --hard origin/main

            # Respaldo de la imagen actual para poder revertir en ~30 s.
            docker image inspect kalidapresio_web:latest >/dev/null 2>&1 \
              && docker tag kalidapresio_web:latest kalidapresio_web:prev || true
            docker image inspect kalidapresio_api:latest >/dev/null 2>&1 \
              && docker tag kalidapresio_api:latest kalidapresio_api:prev || true

            # Reconstruye e intercambia ambos servicios.
            # --build SIEMPRE: SITE_URL y ML_MATT_* se hornean en el bundle;
            # sin reconstruir, el valor viejo sigue dentro.
            docker compose --env-file .env.production up -d --build

            # Espera a que Caddy escuche de verdad. Docker publica el puerto
            # en cuanto arranca el contenedor, mucho antes de que Caddy esté
            # atendiendo: los primeros intentos dan «Connection reset by peer»
            # y eso es el arranque, no una falla.
            #
            # El 7 de septiembre este paso salió en rojo con el sitio ya
            # actualizado y sirviendo. El curl disparó 25 ms después del
            # «Container Started» y el proceso terminó sin reintentar, con un
            # solo «Connection reset» en el log. Por qué no reintentó no lo
            # tengo confirmado; lo que sí está claro es que medir a los 25 ms
            # mide el arranque, no la salud. De ahí los cambios: una espera
            # inicial antes del primer intento, más margen total (90 s),
            # --max-time para que un curl colgado no se coma el ciclo, y
            # ninguna orden suelta que devuelva no-cero dentro del for.
            #
            # Importa que este chequeo sea fiable: corre DESPUÉS del recambio
            # de contenedores, así que un rojo aquí no revierte nada. Si
            # miente, entrena a ignorarlo y tapa la caída de verdad.
            sleep 5

            listo=0
            for i in $(seq 1 30); do
              if curl -fsS -o /dev/null --max-time 5 http://127.0.0.1:8080/; then
                listo=1
                break
              fi
              sleep 3
            done

            if [ "$listo" != "1" ]; then
              echo "❌ El frontend no respondió en 90 s."
              docker compose --env-file .env.production ps
              docker compose --env-file .env.production logs --tail 60 web
              exit 1
            fi
            echo "✅ Frontend respondiendo."

            # Limpia capas huérfanas (no toca las etiquetas :prev).
            docker image prune -f
