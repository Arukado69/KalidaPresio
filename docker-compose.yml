# =============================================================================
# KalidaPresio — despliegue Dockerizado en VPS (Hetzner) detrás de
# Nginx Proxy Manager. Misma arquitectura que NS Hub.
#
#   Internet → NPM (TLS :443, host) → kalidapresio-web:80  (Caddy + sitio SSG)
#                                            └── /api/* → kalidapresio-api:3001
#
# UN SOLO archivo de entorno manda ambos mundos → .env.production:
#   · build.args ${...}  → build-time (SITE_URL, ML_MATT_*: se hornean)
#   · env_file           → runtime    (RESEND_API_KEY, SUBSCRIBE_SECRET, …)
#
# Arranque (build + up):
#   docker compose --env-file .env.production up -d --build
#
# El flag --env-file es lo que hace que la interpolación ${...} de build.args
# lea de .env.production (compose, por defecto, solo interpola desde ./.env).
# =============================================================================

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Se pasan como ARG al Dockerfile → ENV antes de `astro build`.
        SITE_URL: ${SITE_URL}
        ML_MATT_TOOL: ${ML_MATT_TOOL}
        ML_MATT_WORD: ${ML_MATT_WORD}
        PUBLIC_RELAMPAGO_URL: ${PUBLIC_RELAMPAGO_URL:-/data/relampago.json}
        IS_HOT_SALE: ${IS_HOT_SALE:-false}
    image: kalidapresio-web:latest
    container_name: kalidapresio-web
    restart: unless-stopped

    environment:
      # Detrás de NPM siempre :80 (HTTP plano; NPM termina el TLS).
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}

    # Publicado SOLO en el loopback del VPS, por si quieres hacer `curl` local.
    # NPM NO llega por aquí: llega por nombre de contenedor a través de la red
    # compartida (ver abajo).
    ports:
      - "127.0.0.1:8080:80"

    # Dos redes: la propia (para hablar con `api`) y la COMPARTIDA con Nginx
    # Proxy Manager, para que el proxy alcance al contenedor por nombre.
    # Declararla aquí — y NO con `docker network connect` a mano — garantiza
    # que la conexión sobreviva cada recreación del contenedor (`up -d`).
    networks:
      - default
      - npm

    depends_on:
      - api

  api:
    build:
      context: ./backend
    image: kalidapresio-api:latest
    container_name: kalidapresio-api
    restart: unless-stopped

    # Secretos y config de RUNTIME (NO se hornean): SUBSCRIBE_SECRET,
    # RESEND_API_KEY, EXPORT_TOKEN, SUPPORT_INBOX… El mismo archivo que
    # alimenta los build args del frontend.
    env_file:
      - .env.production

    environment:
      PORT: 3001
      HOST: 0.0.0.0                       # accesible por la red interna de Docker
      DB_PATH: /data/database.sqlite      # SQLite en volumen (persistente)
      TRUST_PROXY: 2                      # NPM + Caddy = dos saltos

    expose:
      - "3001"                            # solo red interna; Caddy lo proxya

    volumes:
      - backend_data:/data

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  # La base de suscriptores. Sobrevive a `up -d --build`. NO la borres.
  backend_data:

networks:
  # Red compartida con Nginx Proxy Manager. Es EXTERNA: la posee el stack del
  # proxy en el VPS. Verifica el nombre real con `docker network ls`; si en tu
  # entorno se llama distinto, ajusta `name`. Para pruebas locales sin NPM:
  # `docker network create red_global`.
  npm:
    external: true
    name: red_global
